name: Report outdated studies

on:
  # Enable when the majority of studies have max_version set.
  # Also update the channel ID in the Slack action.
  # schedule:
  #  # Weekly on Monday at 14:00 UTC.
  #  - cron: '0 14 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history is required for accurate per-file last-modify dates.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Find outdated studies
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm seed_tools find_outdated_studies --output outdated-studies-slack.json

      - name: Post to Slack
        if: hashFiles('outdated-studies-slack.json') != ''
        uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c # v3.0.3
        with:
          channel-id: 'C05S50MFHPE' # #finch-updates
          payload-file-path: outdated-studies-slack.json
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
