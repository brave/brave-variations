name: Report outdated studies

on:
  # Enable when the majority of studies have max_version set.
  # Also update the channel ID in the Slack action.
  # schedule:
  #  # Weekly on Monday at 14:00 UTC.
  #  - cron: '0 14 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history is required for accurate per-file last-modify dates.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Find outdated studies
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm seed_tools find_outdated_studies --output outdated-studies-slack.json

      - name: Post to Slack
        if: hashFiles('outdated-studies-slack.json') != ''
        uses: slackapi/slack-github-action@0d95c9a7becc1e6e297d76df9bc735c44f4cbcbc # v3.0.5
        with:
          channel-id: 'C05S50MFHPE' # #finch-updates
          payload-file-path: outdated-studies-slack.json
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
